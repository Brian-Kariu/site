# Dependabot: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a few days after a release before proposing it (not applied to security updates).
    cooldown:
      default-days: 3
    groups:
      # One weekly PR for all minor/patch bumps; auto-merged once the build passes.
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      # Security fixes grouped the same way.
      security-minor-and-patch:
        applies-to: security-updates
        update-types: ["minor", "patch"]
    # Major versions still arrive as individual PRs for manual review.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns: ["*"]
